name: Update Barrier Data

on:
  schedule:
    # 毎日日本時間 午前4時 (UTC 19:00) に自動更新
    - cron: '0 19 * * *'
  workflow_dispatch: # GitHubの画面から手動実行可能

permissions:
  contents: write # リポジトリへのプッシュ権限

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Aggregator Script
        run: python scripts/aggregate_barrier.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tiles.json
          # 変更がある場合のみコミット＆プッシュ
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update barrier tile cache [skip ci]" && git push)
