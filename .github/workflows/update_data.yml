name: Update Barrier Data

on:
  schedule:
    # 毎日日本時間 午前4時 (UTC 19:00) に自動更新
    - cron: '0 19 * * *'
  workflow_dispatch: # 手動実行可能

# ワークフロー全体に書き込み権限を付与
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 最新コミットを取得しトークンを保持
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Aggregator Script
        run: python scripts/aggregate_barrier.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tiles.json
          if git diff --staged --quiet; then
            echo "No changes in data/tiles.json"
          else
            git commit -m "Update barrier tile cache [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
