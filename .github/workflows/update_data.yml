name: Update Nationwide Barrier Data (Weekly)

on:
  schedule:
    # 毎週日曜日 午前3時 JST (土曜日 18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nationwide-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python and Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python3 -m pip install --upgrade pip
          pip install osmium

      - name: Download Japan OSM PBF
        run: |
          echo "Downloading japan-latest.osm.pbf from Geofabrik..."
          curl -L -f -o japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          ls -lh japan-latest.osm.pbf

      - name: Filter Barrier Features (Ultra fast C++ filtering)
        run: |
          echo "Filtering target barrier nodes..."
          # 対象タグを持つノードのみを高速抽出 (2.2GB -> 数十MBに圧縮)
          osmium tags-filter japan-latest.osm.pbf \
            n/barrier=kerb n/kerb \
            n/highway=elevator n/highway=crossing \
            n/wheelchair n/toilets:wheelchair \
            n/amenity n/shop \
            -o filtered_barriers.osm.pbf --overwrite
          
          rm -f japan-latest.osm.pbf
          ls -lh filtered_barriers.osm.pbf

      - name: Run Aggregator
        run: |
          python scripts/aggregate_pbf.py filtered_barriers.osm.pbf
          rm -f filtered_barriers.osm.pbf

      - name: Verify generated data
        run: |
          ls -lh data/
          echo "Total block files: $(ls -1 data/blocks/*.json 2>/dev/null | wc -l)"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update nationwide barrier data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
