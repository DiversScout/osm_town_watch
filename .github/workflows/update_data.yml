name: Update Nationwide Barrier Data (Weekly)

on:
  schedule:
    # 毎週日曜日 午前3時 JST (土曜日 18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nationwide-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python and Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python3 -m pip install --upgrade pip
          pip install osmium

      - name: Download Japan OSM PBF
        run: |
          echo "Downloading japan-latest.osm.pbf from Geofabrik..."
          curl -L -f -o japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          ls -lh japan-latest.osm.pbf

      - name: Filter Barrier Features (Mobility specific)
        run: |
          echo "Filtering target mobility barrier nodes..."
          # 移動困難者向け設備・目的地(店舗・公共施設)に限定して事前抽出
          osmium tags-filter japan-latest.osm.pbf \
            n/barrier=kerb n/kerb \
            n/highway=elevator n/highway=crossing n/highway=ramp n/ramp n/ramp:wheelchair \
            n/wheelchair n/toilets:wheelchair \
            n/tactile_paving=yes \
            n/amenity=toilets \
            n/railway=station n/railway=subway_entrance n/railway=halt \
            n/shop \
            n/amenity=restaurant n/amenity=cafe n/amenity=fast_food n/amenity=food_court n/amenity=bar n/amenity=pub \
            n/amenity=hospital n/amenity=clinic n/amenity=pharmacy n/amenity=dentist \
            n/amenity=townhall n/amenity=community_centre n/amenity=library n/amenity=post_office n/amenity=bank \
            n/amenity=cinema n/amenity=theatre n/amenity=museum \
            -o filtered_barriers.osm.pbf --overwrite
          
          rm -f japan-latest.osm.pbf
          ls -lh filtered_barriers.osm.pbf

      - name: Run Aggregator
        run: |
          python scripts/aggregate_pbf.py filtered_barriers.osm.pbf
          rm -f filtered_barriers.osm.pbf

      - name: Verify generated data
        run: |
          ls -lh data/
          echo "Total block files: $(ls -1 data/blocks/*.json 2>/dev/null | wc -l)"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update nationwide barrier data (mobility focused) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
