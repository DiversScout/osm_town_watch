name: Update Regional Barrier Data (Weekly Cycle)

on:
  schedule:
    # 毎日 日本時間 午前3時 (UTC 18:00) に実行
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: '対象地域を選択 (手動実行)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - kyushu
          - chugoku_shikoku
          - kansai
          - chubu
          - kanto
          - tohoku
          - hokkaido

permissions:
  contents: write

jobs:
  update-regional-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install osmium requests

      - name: Determine target region
        id: select-region
        run: |
          DAY_OF_WEEK=$(date -u +%u)
          MANUAL_INPUT="${{ github.event.inputs.region }}"

          if [ -n "$MANUAL_INPUT" ] && [ "$MANUAL_INPUT" != "auto" ]; then
            TARGET="$MANUAL_INPUT"
          else
            case $DAY_OF_WEEK in
              1) TARGET="kyushu" ;;          # 月曜: 九州・沖縄
              2) TARGET="chugoku_shikoku" ;; # 火曜: 中国・四国
              3) TARGET="kansai" ;;          # 水曜: 関西
              4) TARGET="chubu" ;;           # 木曜: 中部
              5) TARGET="kanto" ;;           # 金曜: 関東
              6) TARGET="tohoku" ;;          # 土曜: 東北
              7) TARGET="hokkaido" ;;        # 日曜: 北海道
            esac
          fi
          echo "target_region=$TARGET" >> $GITHUB_OUTPUT
          echo "Selected region: $TARGET"

      - name: Download Regional PBF
        run: |
          TARGET="${{ steps.select-region.outputs.target_region }}"
          mkdir -p pbf_input

          if [ "$TARGET" = "chugoku_shikoku" ]; then
            curl -L -f -o pbf_input/chugoku.osm.pbf https://download.geofabrik.de/asia/japan/chugoku-latest.osm.pbf
            curl -L -f -o pbf_input/shikoku.osm.pbf https://download.geofabrik.de/asia/japan/shikoku-latest.osm.pbf
          else
            curl -L -f -o "pbf_input/${TARGET}.osm.pbf" "https://download.geofabrik.de/asia/japan/${TARGET}-latest.osm.pbf"
          fi

      - name: Run Aggregator and Merge
        run: |
          python scripts/aggregate_pbf.py pbf_input

      - name: Clean up temporary files
        run: |
          rm -rf pbf_input

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update barrier data: ${{ steps.select-region.outputs.target_region }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
