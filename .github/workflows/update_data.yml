name: Update Nationwide Barrier Data (PBF)

on:
  schedule:
    # 毎週日曜日 03:00 JST (土曜日 18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nationwide-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Osmium
        run: |
          pip install osmium requests

      - name: Download Japan OSM PBF
        run: |
          echo "Downloading japan-latest.osm.pbf..."
          curl -L -f -o japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf

      - name: Run PBF Aggregator
        run: |
          python scripts/aggregate_pbf.py japan-latest.osm.pbf

      - name: Remove PBF file
        run: |
          rm -f japan-latest.osm.pbf

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tiles.json
          if git diff --staged --quiet; then
            echo "No changes in data/tiles.json"
          else
            git commit -m "Update nationwide barrier tile data (PBF) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
