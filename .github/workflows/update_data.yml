name: Update Nationwide Barrier Data (Weekly)

on:
  schedule:
    # 毎週日曜日 午前3時 JST (土曜日 18:00 UTC)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nationwide-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Maximize disk space and enable swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          # 4GB スワップを作成してメモリ不足(OOM Killed)を防止
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install osmium

      - name: Download Japan OSM PBF
        run: |
          echo "Downloading japan-latest.osm.pbf from Geofabrik..."
          curl -L -f -o japan-latest.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          ls -lh japan-latest.osm.pbf

      - name: Run Aggregator
        run: |
          python scripts/aggregate_pbf.py japan-latest.osm.pbf

      - name: Clean up PBF file
        run: |
          rm -f japan-latest.osm.pbf

      - name: Verify generated data
        run: |
          ls -lh data/
          echo "Total block files: $(ls -1 data/blocks/*.json 2>/dev/null | wc -l)"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update nationwide barrier data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
