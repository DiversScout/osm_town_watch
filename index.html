    /* UI パネル共通 */
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(226, 232, 240, 0.8);
      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .top-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

      justify-content: center;
      font-size: 16px;

      color: #1e293b;
    }

      font-size: 11px;
      color: #64748b;
