<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>バリアフリー情報可視化マップ (OSM)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    /* UI コントロールパネル */
    .control-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      z-index: 1000;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }
    .panel-meta {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .btn-primary:hover { background: #1d4ed8; }

    /* グリッドタイル中央の件数ラベル */
    .grid-count-label {
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), 0 0 4px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    /* アイコンピン (最大解像度 Zoom 19) */
    .poi-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px !important;
      height: 28px !important;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      font-size: 14px;
      color: #ffffff;
    }
    .poi-wheelchair { background-color: #0284c7; }
    .poi-elevator   { background-color: #16a34a; }
    .poi-toilet     { background-color: #ea580c; }
    .poi-kerb       { background-color: #9333ea; }

    /* 現在地ピン */
    .current-loc-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #2563eb;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.35);
    }
  </style>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>

<div id="map"></div>

<div class="control-panel">
  <div class="panel-header">
    <div class="panel-title">バリアフリー情報可視化</div>
    <div id="status-badge" class="status-badge">準備中</div>
  </div>
  <div class="panel-meta">
    <span id="zoom-info">ズーム: --</span>
    <span id="count-info">地物数: 0 件</span>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary" id="btn-reload">エリア再取得</button>
    <button class="btn" id="btn-locate">現在地へ移動</button>
    <button class="btn" id="btn-mojiko">門司港駅へ</button>
  </div>
</div>

<script>
  // 門司港駅（デフォルト中心位置）
  const MOJIKO_COORDS = [33.9452, 130.9616];
  const MAX_MAP_ZOOM = 19;
  const GRID_ROWS = 8;  // 画面縦8コマ
  const GRID_COLS = 12; // 画面横12コマ

  // OSM Wiki掲載インスタンスから、HTTPS・CORS対応・低負荷順に選定したエンドポイント
  const OVERPASS_ENDPOINTS = [
    "https://overpass.osm.ch/api/interpreter",          // スイス（低負荷・高速）
    "https://overpass.kumi.systems/api/interpreter",    // Kumi Systems
    "https://overpass.private.coffee/api/interpreter",  // コミュニティミラー
    "https://overpass-api.de/api/interpreter",          // メイン（混雑時はフォールバック）
    "https://lz4.overpass-api.de/api/interpreter"       // メイン予備
  ];

  let map = null;
  let gridLayer = null;
  let markersLayer = null;
  let currentLocationMarker = null;
  let featureStore = new Map();
  let isFetching = false;
  let abortController = null;

  function updateStatus(text, bg = "#e2e8f0", fg = "#475569") {
    const el = document.getElementById('status-badge');
    if (!el) return;
    el.innerText = text;
    el.style.backgroundColor = bg;
    el.style.color = fg;
  }

  function initMap() {
    map = L.map('map', {
      center: MOJIKO_COORDS,
      zoom: 16,
      maxZoom: MAX_MAP_ZOOM,
      zoomControl: false
    });

    L.control.zoom({ position: 'topright' }).addTo(map);

    // OpenStreetMap 公式タイル
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: MAX_MAP_ZOOM,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    gridLayer = L.layerGroup().addTo(map);
    markersLayer = L.layerGroup().addTo(map);

    map.on('zoomend', renderLayers);
    map.on('moveend', renderLayers);

    document.getElementById('btn-reload').addEventListener('click', () => fetchOverpassData());
    document.getElementById('btn-locate').addEventListener('click', () => requestGeolocation(true));
    document.getElementById('btn-mojiko').addEventListener('click', () => {
      map.setView(MOJIKO_COORDS, 19);
      fetchOverpassData();
    });

    // 初回ロード時の現在地判定
    requestGeolocation(false);
  }

  function requestGeolocation(moveTo = false) {
    if (!navigator.geolocation) {
      updateStatus("門司港駅 (標準)", "#e2e8f0", "#475569");
      fetchOverpassData();
      return;
    }

    updateStatus("現在地確認中...", "#fef3c7", "#b45309");

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        setCurMarker(lat, lng);
        map.setView([lat, lng], 19);
        updateStatus("現在地表示中", "#dcfce7", "#15803d");
        fetchOverpassData();
      },
      (err) => {
        console.warn(`Geolocation: ${err.message}`);
        updateStatus("門司港駅 (標準)", "#e2e8f0", "#475569");
        fetchOverpassData();
      },
      { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
    );
  }

  function setCurMarker(lat, lng) {
    if (currentLocationMarker) {
      currentLocationMarker.setLatLng([lat, lng]);
    } else {
      const icon = L.divIcon({
        className: 'current-loc-marker',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      currentLocationMarker = L.marker([lat, lng], { icon }).addTo(map);
    }
  }

  function buildQuery(bbox) {
    const s = bbox.getSouth();
    const w = bbox.getWest();
    const n = bbox.getNorth();
    const e = bbox.getEast();

    return `[out:json][timeout:15];
(
  node["wheelchair"](${s},${w},${n},${e});
  node["highway"="elevator"](${s},${w},${n},${e});
  node["toilets:wheelchair"](${s},${w},${n},${e});
  node["barrier"="kerb"](${s},${w},${n},${e});
);
out body;`;
  }

  async function fetchOverpassData() {
    if (!map) return;
    if (abortController) {
      abortController.abort();
    }
    abortController = new AbortController();

    isFetching = true;
    updateStatus("データ取得中...", "#dbeafe", "#1d4ed8");

    const bbox = map.getBounds();
    const query = buildQuery(bbox);
    let success = false;

    for (const endpoint of OVERPASS_ENDPOINTS) {
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
          },
          body: `data=${encodeURIComponent(query)}`,
          signal: abortController.signal
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data && Array.isArray(data.elements)) {
          data.elements.forEach(item => {
            if (item.lat && item.lon) {
              featureStore.set(item.id, item);
            }
          });
          success = true;
          break;
        }
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn(`[Overpass] ${endpoint} エラー: ${err.message} -> 次のサーバーへ`);
      }
    }

    isFetching = false;
    updateStatus(success ? "正常" : "取得失敗(再試行推奨)", success ? "#dcfce7" : "#fee2e2", success ? "#15803d" : "#b91c1c");
    renderLayers();
  }

  // 地物数に応じた透過グラデーションカラー算出
  function getTileColor(count, maxCount) {
    if (count === 0) return { fill: 'transparent', fillOpacity: 0.0, stroke: 'rgba(148, 163, 184, 0.2)' };

    const ratio = Math.min(count / Math.max(maxCount, 1), 1.0);
    let r, g, b;

    if (ratio <= 0.25) {
      const t = ratio / 0.25;
      r = Math.round(2 + t * (6 - 2));
      g = Math.round(132 + t * (182 - 132));
      b = Math.round(199 + t * (212 - 199));
    } else if (ratio <= 0.6) {
      const t = (ratio - 0.25) / 0.35;
      r = Math.round(6 + t * (245 - 6));
      g = Math.round(182 + t * (158 - 182));
      b = Math.round(212 + t * (11 - 212));
    } else {
      const t = (ratio - 0.6) / 0.4;
      r = Math.round(245 + t * (239 - 245));
      g = Math.round(158 - t * 90);
      b = Math.round(11 + t * (68 - 11));
    }

    const fillOpacity = 0.25 + ratio * 0.45;
    return {
      fill: `rgb(${r}, ${g}, ${b})`,
      fillOpacity: fillOpacity,
      stroke: 'rgba(255, 255, 255, 0.45)'
    };
  }

  // 画面内を縦8×横12に分割してグリッド描画
  function renderGridHeatmap(elements) {
    gridLayer.clearLayers();

    const bounds = map.getBounds();
    const south = bounds.getSouth();
    const north = bounds.getNorth();
    const west = bounds.getWest();
    const east = bounds.getEast();

    const latStep = (north - south) / GRID_ROWS;
    const lngStep = (east - west) / GRID_COLS;

    const gridCounts = Array.from({ length: GRID_ROWS }, () => Array(GRID_COLS).fill(0));
    let maxCellCount = 0;

    elements.forEach(el => {
      if (bounds.contains([el.lat, el.lon])) {
        const row = Math.min(GRID_ROWS - 1, Math.max(0, Math.floor((north - el.lat) / latStep)));
        const col = Math.min(GRID_COLS - 1, Math.max(0, Math.floor((el.lon - west) / lngStep)));
        gridCounts[row][col]++;
        if (gridCounts[row][col] > maxCellCount) {
          maxCellCount = gridCounts[row][col];
        }
      }
    });

    for (let r = 0; r < GRID_ROWS; r++) {
      for (let c = 0; c < GRID_COLS; c++) {
        const cellNorth = north - r * latStep;
        const cellSouth = cellNorth - latStep;
        const cellWest = west + c * lngStep;
        const cellEast = cellWest + lngStep;

        const cellBounds = [[cellSouth, cellWest], [cellNorth, cellEast]];
        const count = gridCounts[r][c];
        const colorStyle = getTileColor(count, maxCellCount);

        L.rectangle(cellBounds, {
          color: colorStyle.stroke,
          weight: 1,
          fillColor: colorStyle.fill,
          fillOpacity: colorStyle.fillOpacity,
          interactive: false
        }).addTo(gridLayer);

        if (count > 0) {
          const centerLat = cellSouth + latStep / 2;
          const centerLng = cellWest + lngStep / 2;

          const labelIcon = L.divIcon({
            className: 'grid-count-label',
            html: `<span class="grid-count-badge">${count}</span>`,
            iconSize: [26, 20],
            iconAnchor: [13, 10]
          });

          L.marker([centerLat, centerLng], { icon: labelIcon, interactive: false }).addTo(gridLayer);
        }
      }
    }
  }

  function renderLayers() {
    if (!map) return;
    const zoom = map.getZoom();
    const elements = Array.from(featureStore.values());

    document.getElementById('zoom-info').innerText = `ズーム: ${zoom} / 最大:${MAX_MAP_ZOOM}`;
    document.getElementById('count-info').innerText = `地物数: ${elements.length} 件`;

    // 最大ズーム未満 (Zoom < 19): 縦8×横12のグリッドヒートマップ
    if (zoom < MAX_MAP_ZOOM) {
      if (markersLayer) markersLayer.clearLayers();
      renderGridHeatmap(elements);
    }
    // 最大ズーム (Zoom 19): 個別地物アイコン強調表示
    else {
      if (gridLayer) gridLayer.clearLayers();

      if (markersLayer) {
        markersLayer.clearLayers();
        const bounds = map.getBounds();

        elements.forEach(el => {
          if (bounds.contains([el.lat, el.lon])) {
            createMarker(el).addTo(markersLayer);
          }
        });
      }
    }
  }

  function createMarker(item) {
    const tags = item.tags || {};
    let iconClass = 'poi-wheelchair';
    let iconChar = '♿';
    let title = tags.name || '車椅子対応施設';

    if (tags.highway === 'elevator') {
      iconClass = 'poi-elevator';
      iconChar = '🛗';
      title = 'エレベーター';
    } else if (tags['toilets:wheelchair'] || tags.amenity === 'toilets') {
      iconClass = 'poi-toilet';
      iconChar = '🚻';
      title = '多機能トイレ';
    } else if (tags.barrier === 'kerb') {
      iconClass = 'poi-kerb';
      iconChar = '⤓';
      title = `段差/縁石 (${tags.kerb || '詳細なし'})`;
    }

    const icon = L.divIcon({
      className: `poi-icon ${iconClass}`,
      html: iconChar,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });

    const marker = L.marker([item.lat, item.lon], { icon });
    let popup = `<strong>${title}</strong><div style="font-size:11px; margin-top:4px; max-height:140px; overflow-y:auto;">`;
    popup += `<div style="color:#64748b; margin-bottom:2px;">OSM ID: ${item.id}</div>`;
    for (const [k, v] of Object.entries(tags)) {
      popup += `<div><span style="color:#64748b;">${k}:</span> ${v}</div>`;
    }
    popup += `</div>`;
    marker.bindPopup(popup);

    return marker;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMap);
  } else {
    initMap();
  }
</script>
</body>
</html>
